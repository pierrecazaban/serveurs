<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- La page de connexion Microsoft demande « Segoe UI » (absente sous Linux) sans
     police de secours sans empattement : on lui donne une équivalente. -->
<fontconfig>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Semibold</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Light</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
</fontconfig>
